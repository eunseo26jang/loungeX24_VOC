<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>라운지엑스 24h 리뷰 조치 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-18 flex items-center justify-between py-3">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-headset text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold text-white">라운지엑스 24h 리뷰 조치 시스템</h1>
                    <p class="text-xs text-slate-400">마케팅팀 ⟷ 리테일 팀 실시간 VOC 협업 관제 센터</p>
                </div>
            </div>
            <div>
                <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold shadow-lg transition flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>신규 리뷰 VOC 등록</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">

        <!-- Branch Selector Tabs -->
        <div class="mb-6 overflow-x-auto pb-2">
            <div id="branch-tabs" class="flex space-x-2 min-w-max">
                <!-- Dynamically rendered branch tabs -->
            </div>
        </div>

        <!-- Statistics Summary Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">선택 지점 총 VOC</p>
                    <h3 id="stat-total" class="text-3xl font-bold text-slate-900 mt-1">0</h3>
                </div>
                <div class="p-3 bg-blue-50 text-blue-600 rounded-xl">
                    <i class="fa-solid fa-clipboard-list text-xl"></i>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">미조치 건수</p>
                    <h3 id="stat-pending" class="text-3xl font-bold text-rose-600 mt-1">0</h3>
                </div>
                <div class="p-3 bg-rose-50 text-rose-600 rounded-xl">
                    <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">조치 중</p>
                    <h3 id="stat-progress" class="text-3xl font-bold text-amber-600 mt-1">0</h3>
                </div>
                <div class="p-3 bg-amber-50 text-amber-600 rounded-xl">
                    <i class="fa-solid fa-spinner text-xl"></i>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">조치 완료율</p>
                    <h3 id="stat-rate" class="text-3xl font-bold text-emerald-600 mt-1">0%</h3>
                </div>
                <div class="p-3 bg-emerald-50 text-emerald-600 rounded-xl">
                    <i class="fa-solid fa-circle-check text-xl"></i>
                </div>
            </div>
        </div>

        <!-- Filters & Search Toolbar -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-8 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <select id="filter-status" onchange="renderDashboard()" class="bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-xl px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="ALL">전체 상태 (모두)</option>
                    <option value="미조치">미조치</option>
                    <option value="조치중">조치 중</option>
                    <option value="완료">완료</option>
                </select>
                <select id="filter-platform" onchange="renderDashboard()" class="bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-xl px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="ALL">전체 플랫폼</option>
                    <option value="네이버 플레이스">네이버 플레이스</option>
                    <option value="카카오맵">카카오맵</option>
                    <option value="구글맵">구글맵</option>
                </select>
                <select id="filter-category" onchange="renderDashboard()" class="bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-xl px-3 py-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="ALL">전체 카테고리</option>
                    <option value="난방/환경">난방/환경</option>
                    <option value="청결">청결</option>
                    <option value="CS 응대">CS 응대</option>
                    <option value="제품 품질">제품 품질</option>
                    <option value="기타">기타</option>
                </select>
            </div>
            <div class="w-full md:w-80 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="search-input" oninput="renderDashboard()" placeholder="내용, 등록자 검색..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 text-sm rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
        </div>

        <!-- VOC Card Grid -->
        <div id="voc-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Cards Render Here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden py-20 text-center bg-white rounded-2xl border border-slate-200 mt-4 shadow-sm">
            <i class="fa-regular fa-folder-open text-4xl text-slate-300 mb-3"></i>
            <p class="text-slate-600 font-semibold text-base">조건에 해당하는 VOC 리뷰가 없습니다.</p>
            <p class="text-slate-400 text-xs mt-1">신규 리뷰 VOC 등록 버튼을 눌러 피드백을 추가해 보세요.</p>
        </div>

    </main>

    <!-- Modal: Register VOC -->
    <div id="voc-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-200">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-bold text-slate-900 flex items-center">
                    <i class="fa-solid fa-circle-plus text-indigo-600 mr-2"></i>신규 리뷰 VOC 접수 등록
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="voc-form" onsubmit="addVoc(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">매장 지점</label>
                        <select id="input-branch" class="w-full bg-slate-50 border border-slate-300 text-sm rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">수집 플랫폼</label>
                        <select id="input-platform" class="w-full bg-slate-50 border border-slate-300 text-sm rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="네이버 플레이스">네이버 플레이스</option>
                            <option value="카카오맵">카카오맵</option>
                            <option value="구글맵">구글맵</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">불만 카테고리</label>
                        <select id="input-category" class="w-full bg-slate-50 border border-slate-300 text-sm rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="난방/환경">난방/환경</option>
                            <option value="청결">청결 불량</option>
                            <option value="CS 응대">CS / 응대 지연</option>
                            <option value="제품 품질">제품 품질 (커피/빵/미숫가루)</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">초기 상태</label>
                        <select id="input-status" class="w-full bg-slate-50 border border-slate-300 text-sm rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="미조치">미조치</option>
                            <option value="조치중">조치 중</option>
                            <option value="완료">완료</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">리뷰 원문 및 핵심 불만 사항</label>
                    <textarea id="input-content" rows="3" required placeholder="고객 리뷰 내용 및 특이사항을 입력하세요..." class="w-full bg-slate-50 border border-slate-300 text-sm rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">등록자 (마케팅팀)</label>
                    <input type="text" id="input-author" required placeholder="예: 마케팅팀 김인턴" class="w-full bg-slate-50 border border-slate-300 text-sm rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex justify-end space-x-3 pt-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2.5 border border-slate-300 text-slate-700 text-sm font-semibold rounded-xl hover:bg-slate-100 transition">취소</button>
                    <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl shadow-md transition">등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl transform translate-y-28 opacity-0 transition-all duration-300 z-50 flex items-center space-x-3 border border-slate-800">
        <i class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toast-msg" class="text-sm font-medium">성공적으로 처리되었습니다.</span>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // 9개 지점 정의
        const branches = [
            "전체 지점 보기",
            "강남역점",
            "마포프론트원점",
            "성수본점",
            "서울숲 AK점",
            "원그로브점",
            "가락IT벤처타워점",
            "을지돌담길점",
            "용산더프라임점",
            "상암DMC점"
        ];

        let currentBranch = "전체 지점 보기";

        // 초기 목업 데이터 (상암DMC점 복합 불만 포함)
        let vocList = [
            {
                id: 1,
                branch: '상암DMC점',
                platform: '네이버 플레이스',
                category: '난방/환경',
                content: '매장 내 난방이 전혀 안 되어 추위 속에서 덜덜 떨었습니다. 분실물 문의에도 응답이 하루 이상 지연됨.',
                status: '미조치',
                author: '마케팅팀 김인턴',
                date: '11.11 14:20',
                logs: [
                    { author: '마케팅팀 김인턴', text: '네이버 플레이스 1점 리뷰 접수 및 슬랙 공유 완료. 리테일 팀 점검 요청.', date: '11.11 14:25' }
                ]
            },
            {
                id: 2,
                branch: '상암DMC점',
                platform: '구글맵',
                category: 'CS 응대',
                content: '직원분 응대가 너무 불친절하고 일 터져도 모르는 체하는 느낌입니다. CCTV는 장식인가요?',
                status: '조치중',
                author: '마케팅팀 장과장',
                date: '11.10 18:30',
                logs: [
                    { author: '마케팅팀 장과장', text: '권리침해 신고 대상 검토 중 (모욕 및 허위성 발언)', date: '11.10 18:45' },
                    { author: '리테일 팀장', text: '야간 근무자 대상 CS 마인드 및 응대 매뉴얼 재교육 실시 완료', date: '11.11 09:10' }
                ]
            },
            {
                id: 3,
                branch: '강남역점',
                platform: '카카오맵',
                category: '청결',
                content: '테이블 정리가 안 되어 있어서 앉기 찝찝했습니다.',
                status: '완료',
                author: '마케팅팀 김인턴',
                date: '11.09 12:10',
                logs: [
                    { author: '마케팅팀 김인턴', text: '청결 불만 VOC 등록', date: '11.09 12:15' },
                    { author: '강남역점 리테일 매니저', text: '홀 순회 주기 30분으로 단축 완료', date: '11.09 14:00' }
                ]
            }
        ];

        window.onload = function() {
            renderBranchTabs();
            populateModalBranchSelect();
            renderDashboard();
        };

        // Render Branch Tabs
        function renderBranchTabs() {
            const container = document.getElementById('branch-tabs');
            container.innerHTML = '';
            branches.forEach(branch => {
                const isActive = currentBranch === branch;
                const btn = document.createElement('button');
                btn.className = `px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition shrink-0 shadow-sm ${isActive ? 'bg-indigo-600 text-white shadow-indigo-100' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'}`;
                btn.innerHTML = `<i class="fa-solid fa-store mr-1.5 text-xs"></i>${branch}`;
                btn.onclick = () => {
                    currentBranch = branch;
                    renderBranchTabs();
                    renderDashboard();
                };
                container.appendChild(btn);
            });
        }

        // Populate Modal Branch Select
        function populateModalBranchSelect() {
            const select = document.getElementById('input-branch');
            select.innerHTML = '';
            branches.filter(b => b !== "전체 지점 보기").forEach(branch => {
                const opt = document.createElement('option');
                opt.value = branch;
                opt.innerText = branch;
                select.appendChild(opt);
            });
        }

        // Render Dashboard Stats & Cards
        function renderDashboard() {
            const statusFilter = document.getElementById('filter-status').value;
            const platformFilter = document.getElementById('filter-platform').value;
            const categoryFilter = document.getElementById('filter-category').value;
            const searchQuery = document.getElementById('search-input').value.toLowerCase();

            const filtered = vocList.filter(item => {
                const matchBranch = currentBranch === "전체 지점 보기" || item.branch === currentBranch;
                const matchStatus = statusFilter === 'ALL' || item.status === statusFilter;
                const matchPlatform = platformFilter === 'ALL' || item.platform === platformFilter;
                const matchCategory = categoryFilter === 'ALL' || item.category === categoryFilter;
                const matchSearch = item.content.toLowerCase().includes(searchQuery) || item.author.toLowerCase().includes(searchQuery) || item.platform.toLowerCase().includes(searchQuery);
                return matchBranch && matchStatus && matchPlatform && matchCategory && matchSearch;
            });

            // Target scope stats (Current branch view scope)
            const targetList = currentBranch === "전체 지점 보기" ? vocList : vocList.filter(i => i.branch === currentBranch);
            const total = targetList.length;
            const pending = targetList.filter(i => i.status === '미조치').length;
            const progress = targetList.filter(i => i.status === '조치중').length;
            const completed = targetList.filter(i => i.status === '완료').length;
            const rate = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-progress').innerText = progress;
            document.getElementById('stat-rate').innerText = rate + '%';

            const grid = document.getElementById('voc-grid');
            const emptyState = document.getElementById('empty-state');
            grid.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(item => {
                let badgeColor = '';
                if (item.status === '미조치') badgeColor = 'bg-rose-50 text-rose-700 border-rose-200';
                else if (item.status === '조치중') badgeColor = 'bg-amber-50 text-amber-700 border-amber-200';
                else badgeColor = 'bg-emerald-50 text-emerald-700 border-emerald-200';

                let catColor = 'bg-indigo-50 text-indigo-700';
                if (item.category === '난방/환경') catColor = 'bg-orange-50 text-orange-700';
                if (item.category === '청결') catColor = 'bg-sky-50 text-sky-700';
                if (item.category === 'CS 응대') catColor = 'bg-purple-50 text-purple-700';
                if (item.category === '제품 품질') catColor = 'bg-pink-50 text-pink-700';

                let logsHtml = '';
                item.logs.forEach(log => {
                    logsHtml += `
                        <div class="text-xs bg-slate-50 p-2.5 rounded-xl mb-2 border border-slate-100">
                            <div class="flex justify-between font-semibold text-slate-700 mb-1">
                                <span><i class="fa-solid fa-user-circle mr-1 text-slate-400"></i>${log.author}</span>
                                <span class="text-[10px] text-slate-400">${log.date}</span>
                            </div>
                            <p class="text-slate-600 leading-relaxed">${log.text}</p>
                        </div>
                    `;
                });

                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col justify-between hover:shadow-md transition';
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-lg border ${badgeColor}">${item.status}</span>
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-lg ${catColor}">${item.category}</span>
                        </div>
                        <div class="text-xs font-medium text-slate-400 mb-1.5 flex items-center justify-between">
                            <span><i class="fa-solid fa-store mr-1 text-indigo-500"></i><strong class="text-slate-700">${item.branch}</strong></span>
                            <span>${item.date}</span>
                        </div>
                        <div class="text-xs text-slate-400 mb-3.5 flex items-center space-x-1.5">
                            <i class="fa-solid fa-globe text-slate-400"></i>
                            <span class="font-medium">${item.platform}</span>
                            <span class="text-slate-300">•</span>
                            <span>등록자: ${item.author}</span>
                        </div>
                        <p class="text-slate-800 text-sm font-medium leading-relaxed mb-4">"${item.content}"</p>
                        
                        <div class="border-t border-slate-100 pt-3.5 mb-3">
                            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">마케팅팀 ⟷ 리테일 팀 코멘트 타임라인</p>
                            <div class="max-h-36 overflow-y-auto pr-1 space-y-1">
                                ${logsHtml}
                            </div>
                        </div>
                    </div>

                    <div class="pt-3.5 border-t border-slate-100 space-y-2.5">
                        <div class="flex items-center space-x-2">
                            <select id="status-change-${item.id}" class="bg-slate-50 border border-slate-300 text-xs rounded-xl px-3 py-2 outline-none font-medium text-slate-700">
                                <option value="미조치" ${item.status==='미조치'?'selected':''}>미조치</option>
                                <option value="조치중" ${item.status==='조치중'?'selected':''}>조치중</option>
                                <option value="완료" ${item.status==='완료'?'selected':''}>완료</option>
                            </select>
                            <button onclick="updateStatus(${item.id})" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold px-3.5 py-2 rounded-xl transition">상태변경</button>
                        </div>
                        <div class="flex items-center space-x-2">
                            <input type="text" id="log-input-${item.id}" placeholder="조치 내역 및 코멘트 입력..." class="w-full bg-slate-50 border border-slate-300 text-xs rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
                            <button onclick="addLog(${item.id})" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3.5 py-2 rounded-xl transition shrink-0 shadow-sm">등록</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Modal Controls
        function openModal() {
            document.getElementById('voc-modal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('voc-modal').classList.add('hidden');
            document.getElementById('voc-form').reset();
        }

        // Add New VOC
        function addVoc(e) {
            e.preventDefault();
            const branch = document.getElementById('input-branch').value;
            const platform = document.getElementById('input-platform').value;
            const category = document.getElementById('input-category').value;
            const content = document.getElementById('input-content').value;
            const status = document.getElementById('input-status').value;
            const author = document.getElementById('input-author').value;

            const now = new Date();
            const dateStr = `${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            const newItem = {
                id: Date.now(),
                branch,
                platform,
                category,
                content,
                status,
                author,
                date: dateStr,
                logs: [{ author, text: '신규 VOC 최초 접수 등록', date: dateStr }]
            };

            vocList.unshift(newItem);
            renderDashboard();
            closeModal();
            showToast(`[${branch}] 신규 리뷰 VOC가 성공적으로 등록되었습니다.`);
        }

        // Update Status
        function updateStatus(id) {
            const selectEl = document.getElementById(`status-change-${id}`);
            const newStatus = selectEl.value;
            const item = vocList.find(i => i.id === id);
            if (item) {
                item.status = newStatus;
                const now = new Date();
                const dateStr = `${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                item.logs.push({ author: '시스템', text: `처리 상태가 [${newStatus}] (으)로 변경되었습니다.`, date: dateStr });
                renderDashboard();
                showToast(`처리 상태가 [${newStatus}] (으)로 변경되었습니다.`);
            }
        }

        // Add Log / Comment
        function addLog(id) {
            const inputEl = document.getElementById(`log-input-${id}`);
            const text = inputEl.value.trim();
            if (!text) {
                showToast('코멘트 내용을 입력해주세요.');
                return;
            }

            const item = vocList.find(i => i.id === id);
            if (item) {
                const now = new Date();
                const dateStr = `${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                item.logs.push({ author: '마케팅팀 / 리테일 팀', text, date: dateStr });
                inputEl.value = '';
                renderDashboard();
                showToast('조치 내역 및 코멘트가 기록되었습니다.');
            }
        }

        // Toast Notification
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-msg');
            msgEl.innerText = msg;
            toast.classList.remove('translate-y-28', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-28', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
