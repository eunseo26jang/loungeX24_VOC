<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>라운지엑스 24h 리뷰 조치 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-lg">
                    <i class="fa-solid fa-headset text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">라운지엑스 24h 리뷰 조치 시스템</h1>
                    <p class="text-xs text-slate-400">마케팅팀 ⟷ 리테일 팀 실시간 VOC 협업 및 조치 관제 센터</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow transition flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>신규 리뷰 등록</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- Branch Tabs -->
        <div class="mb-6 overflow-x-auto pb-2">
            <div id="branchTabs" class="flex space-x-2 min-w-max">
                <button onclick="filterBranch('전체')" class="branch-btn px-4 py-2 rounded-xl text-sm font-medium transition bg-slate-900 text-white shadow" data-branch="전체">전체 지점</button>
                <button onclick="filterBranch('강남역점')" class="branch-btn px-4 py-2 rounded-xl text-sm font-medium transition bg-white text-slate-600 hover:bg-slate-100 border border-slate-200" data-branch="강남역점">강남역점</button>
                <button onclick="filterBranch('마포프론트원점')" class="branch-btn px-4 py-2 rounded-xl text-sm font-medium transition bg-white text-slate-600 hover:bg-slate-100 border border-slate-200" data-branch="마포프론트원점">마포프론트원점</button>
                <button onclick="filterBranch('성수본점')" class="branch-btn px-4 py-2 rounded-xl text-sm font-medium transition bg-white text-slate-600 hover:bg-slate-100 border border-slate-200" data-branch="성수본점">성수본점</button>
                <button onclick="filterBranch('서울숲 AK점')" class="branch-btn px-4 py-2 rounded-xl text-sm font-medium transition bg-white text-slate-600 hover:bg-slate-100 border border-slate-200" data-branch="서울숲 AK점">서울숲 AK점</button>
                <button onclick="filterBranch('원그로브점')" class="branch-btn px-4 py-2 rounded-xl text-sm font-medium transition bg-white text-slate-600 hover:bg-slate-100 border border-slate-200" data-branch="원그로브점">원그로브점</button>
                <button onclick="filterBranch('가락IT벤처타워점')" class="branch-btn px-4 py-2 rounded-xl text-sm font-medium transition bg-white text-slate-600 hover:bg-slate-100 border border-slate-200" data-branch="가락IT벤처타워점">가락IT벤처타워점</button>
                <button onclick="filterBranch('을지돌담길점')" class="branch-btn px-4 py-2 rounded-xl text-sm font-medium transition bg-white text-slate-600 hover:bg-slate-100 border border-slate-200" data-branch="을지돌담길점">을지돌담길점</button>
                <button onclick="filterBranch('용산더프라임점')" class="branch-btn px-4 py-2 rounded-xl text-sm font-medium transition bg-white text-slate-600 hover:bg-slate-100 border border-slate-200" data-branch="용산더프라임점">용산더프라임점</button>
                <button onclick="filterBranch('상암DMC점')" class="branch-btn px-4 py-2 rounded-xl text-sm font-medium transition bg-white text-slate-600 hover:bg-slate-100 border border-slate-200" data-branch="상암DMC점">상암DMC점</button>
            </div>
        </div>

        <!-- Dashboard Metrics Bar -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase">전체 접수 리뷰</p>
                    <h3 id="statTotal" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="bg-blue-50 text-blue-600 p-3 rounded-xl"><i class="fa-solid fa-clipboard-list text-lg"></i></div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase">미조치 건수</p>
                    <h3 id="statPending" class="text-2xl font-bold text-rose-600 mt-1">0</h3>
                </div>
                <div class="bg-rose-50 text-rose-600 p-3 rounded-xl"><i class="fa-solid fa-triangle-exclamation text-lg"></i></div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase">조치 중</p>
                    <h3 id="statProgress" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
                </div>
                <div class="bg-amber-50 text-amber-600 p-3 rounded-xl"><i class="fa-solid fa-spinner text-lg"></i></div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase">조치 완료율</p>
                    <h3 id="statRate" class="text-2xl font-bold text-emerald-600 mt-1">0%</h3>
                </div>
                <div class="bg-emerald-50 text-emerald-600 p-3 rounded-xl"><i class="fa-solid fa-circle-check text-lg"></i></div>
            </div>
        </div>

        <!-- Filters & Search -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                <select id="filterStatus" onchange="renderCards()" class="bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-xl px-3 py-2 outline-none focus:border-indigo-500">
                    <option value="전체">상태: 전체 보기</option>
                    <option value="미조치">미조치</option>
                    <option value="조치중">조치중</option>
                    <option value="완료">완료</option>
                </select>
                <select id="filterCategory" onchange="renderCards()" class="bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-xl px-3 py-2 outline-none focus:border-indigo-500">
                    <option value="전체">카테고리: 전체</option>
                    <option value="난방/환경">난방/환경</option>
                    <option value="청결">청결</option>
                    <option value="CS 응대">CS 응대</option>
                    <option value="제품 품질">제품 품질</option>
                    <option value="기타">기타</option>
                </select>
            </div>
            <div class="relative w-full sm:w-72">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-search"></i></span>
                <input type="text" id="searchInput" oninput="renderCards()" placeholder="내용 또는 작성자 검색..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-300 text-sm rounded-xl outline-none focus:border-indigo-500">
            </div>
        </div>

        <!-- VOC Card Grid -->
        <div id="vocGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Cards Render Here -->
        </div>

    </main>

    <!-- Modal: Add New VOC -->
    <div id="addModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden">
            <div class="px-6 py-4 bg-slate-900 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-circle-plus mr-2 text-indigo-400"></i>신규 리뷰 VOC 등록</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="vocForm" onsubmit="addVoc(event)" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">지점 선택</label>
                        <select id="addBranch" required class="w-full bg-slate-50 border border-slate-300 text-sm rounded-xl p-2.5 outline-none focus:border-indigo-500">
                            <option value="상암DMC점">상암DMC점</option>
                            <option value="강남역점">강남역점</option>
                            <option value="마포프론트원점">마포프론트원점</option>
                            <option value="성수본점">성수본점</option>
                            <option value="서울숲 AK점">서울숲 AK점</option>
                            <option value="원그로브점">원그로브점</option>
                            <option value="가락IT벤처타워점">가락IT벤처타워점</option>
                            <option value="을지돌담길점">을지돌담길점</option>
                            <option value="용산더프라임점">용산더프라임점</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">플랫폼</label>
                        <select id="addPlatform" required class="w-full bg-slate-50 border border-slate-300 text-sm rounded-xl p-2.5 outline-none focus:border-indigo-500">
                            <option value="네이버 플레이스">네이버 플레이스</option>
                            <option value="구글맵">구글맵</option>
                            <option value="카카오맵">카카오맵</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">평점</label>
                        <select id="addRating" class="w-full bg-slate-50 border border-slate-300 text-sm rounded-xl p-2.5 outline-none focus:border-indigo-500">
                            <option value="1점">⭐ 1점 (매우 불만)</option>
                            <option value="2점">⭐⭐ 2점 (불만)</option>
                            <option value="3점">⭐⭐⭐ 3점 (보통)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">카테고리</label>
                        <select id="addCategory" class="w-full bg-slate-50 border border-slate-300 text-sm rounded-xl p-2.5 outline-none focus:border-indigo-500">
                            <option value="난방/환경">난방/환경</option>
                            <option value="청결">청결</option>
                            <option value="CS 응대">CS 응대</option>
                            <option value="제품 품질">제품 품질</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">리뷰 내용 요약</label>
                    <textarea id="addContent" required rows="3" placeholder="고객 불만 핵심 내용 입력..." class="w-full bg-slate-50 border border-slate-300 text-sm rounded-xl p-2.5 outline-none focus:border-indigo-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">등록자 (마케팅팀)</label>
                    <input type="text" id="addAuthor" required placeholder="예: 마케팅팀 장은서 인턴" class="w-full bg-slate-50 border border-slate-300 text-sm rounded-xl p-2.5 outline-none focus:border-indigo-500">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-sm font-semibold hover:bg-slate-200">취소</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-semibold hover:bg-indigo-500 shadow">등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let vocList = [
            {
                id: 1,
                branch: '상암DMC점',
                platform: '네이버 플레이스',
                rating: '1점',
                category: '난방/환경',
                content: '야간에 매장 내 난방이 전혀 안 되어 너무 추웠습니다. 분실물 문의했는데 응대도 늦고 불친절해요.',
                author: '마케팅팀',
                status: '미조치',
                date: '2026-11-10 14:20',
                comments: []
            },
            {
                id: 2,
                branch: '강남역점',
                platform: '구글맵',
                rating: '2점',
                category: '청결',
                content: '테이블 정리 정돈이 안 되어 있고 바닥이 끈적거립니다.',
                author: '마케팅팀',
                status: '조치중',
                date: '2026-11-11 09:15',
                comments: [
                    { author: '리테일 팀 김점장', text: '홀 스태프에게 전달하여 즉시 재청소 완료했습니다.', time: '2026-11-11 10:00' }
                ]
            }
        ];

        let currentBranchFilter = '전체';

        function filterBranch(branch) {
            currentBranchFilter = branch;
            document.querySelectorAll('.branch-btn').forEach(btn => {
                if(btn.dataset.branch === branch) {
                    btn.className = "branch-btn px-4 py-2 rounded-xl text-sm font-medium transition bg-slate-900 text-white shadow";
                } else {
                    btn.className = "branch-btn px-4 py-2 rounded-xl text-sm font-medium transition bg-white text-slate-600 hover:bg-slate-100 border border-slate-200";
                }
            });
            renderCards();
        }

        function renderCards() {
            const statusFilter = document.getElementById('filterStatus').value;
            const categoryFilter = document.getElementById('filterCategory').value;
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('vocGrid');

            let filtered = vocList.filter(item => {
                let matchBranch = (currentBranchFilter === '전체' || item.branch === currentBranchFilter);
                let matchStatus = (statusFilter === '전체' || item.status === statusFilter);
                let matchCategory = (categoryFilter === '전체' || item.category === categoryFilter);
                let matchSearch = item.content.toLowerCase().includes(searchKeyword) || item.author.toLowerCase().includes(searchKeyword);
                return matchBranch && matchStatus && matchCategory && matchSearch;
            });

            // Update Stats
            let total = vocList.length;
            let pending = vocList.filter(i => i.status === '미조치').length;
            let progress = vocList.filter(i => i.status === '조치중').length;
            let completed = vocList.filter(i => i.status === '완료').length;
            let rate = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('statTotal').innerText = total;
            document.getElementById('statPending').innerText = pending;
            document.getElementById('statProgress').innerText = progress;
            document.getElementById('statRate').innerText = rate + '%';

            if(filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 text-center bg-white rounded-2xl border border-slate-200">
                        <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
                        <p class="text-slate-500 text-sm font-medium">등록된 VOC 리뷰가 없습니다.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(item => {
                let statusBadge = '';
                if(item.status === '미조치') {
                    statusBadge = '<button onclick="cycleStatus(' + item.id + ')" class="px-3 py-1 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs font-bold rounded-xl flex items-center space-x-1.5 transition shadow-sm"><i class="fa-solid fa-circle-exclamation"></i><span>미조치</span></button>';
                } else if(item.status === '조치중') {
                    statusBadge = '<button onclick="cycleStatus(' + item.id + ')" class="px-3 py-1 bg-amber-50 hover:bg-amber-100 text-amber-600 border border-amber-200 text-xs font-bold rounded-xl flex items-center space-x-1.5 transition shadow-sm"><i class="fa-solid fa-spinner"></i><span>조치중</span></button>';
                } else {
                    statusBadge = '<button onclick="cycleStatus(' + item.id + ')" class="px-3 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 border border-emerald-200 text-xs font-bold rounded-xl flex items-center space-x-1.5 transition shadow-sm"><i class="fa-solid fa-circle-check"></i><span>완료</span></button>';
                }

                let commentsHtml = item.comments.map(c => `
                    <div class="bg-slate-50 p-2.5 rounded-xl text-xs mb-2 border border-slate-100">
                        <div class="flex justify-between font-semibold text-slate-700 mb-1">
                            <span><i class="fa-solid fa-user-tie mr-1 text-indigo-600"></i>${c.author}</span>
                            <span class="text-[10px] text-slate-400 font-normal">${c.time}</span>
                        </div>
                        <p class="text-slate-600">${c.text}</p>
                    </div>
                `).join('');

                return `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between overflow-hidden">
                        <div class="p-5">
                            <div class="flex justify-between items-start mb-3">
                                <div class="flex items-center space-x-2">
                                    <span class="px-2.5 py-1 bg-indigo-50 text-indigo-700 text-xs font-bold rounded-lg">${item.branch}</span>
                                    <span class="text-xs text-slate-500 font-medium">${item.platform}</span>
                                </div>
                                <div class="flex items-center space-x-2">
                                    ${statusBadge}
                                    <button onclick="deleteVoc(${item.id})" title="VOC 삭제" class="text-slate-400 hover:text-rose-600 p-1.5 rounded-lg hover:bg-rose-50 transition"><i class="fa-solid fa-trash-can text-sm"></i></button>
                                </div>
                            </div>
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs font-bold text-slate-600 bg-slate-100 px-2 py-0.5 rounded">${item.category}</span>
                                <span class="text-xs text-rose-500 font-bold">${item.rating}</span>
                            </div>
                            <p class="text-sm text-slate-700 leading-relaxed mb-4">${item.content}</p>
                            
                            <div class="border-t border-slate-100 pt-3 mb-3">
                                <p class="text-xs font-semibold text-slate-400 mb-2">리테일 팀 & 마케팅팀 조치 내역</p>
                                <div class="space-y-1 max-h-40 overflow-y-auto">${commentsHtml || '<p class="text-xs text-slate-400 italic">등록된 조치 내역이 없습니다.</p>'}</div>
                            </div>
                        </div>
                        
                        <div class="px-5 pb-5 bg-slate-50/50 pt-3 border-t border-slate-100 flex items-center space-x-2">
                            <input type="text" id="commentInput_${item.id}" placeholder="조치 내용 또는 코멘트 입력..." class="flex-1 text-xs bg-white border border-slate-300 rounded-xl px-3 py-2 outline-none focus:border-indigo-500">
                            <button onclick="addComment(${item.id})" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl text-xs font-semibold shadow transition">등록</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); document.getElementById('addModal').classList.add('flex'); }
        function closeAddModal() { document.getElementById('addModal').classList.remove('flex'); document.getElementById('addModal').classList.add('hidden'); }

        function addVoc(e) {
            e.preventDefault();
            let newVoc = {
                id: Date.now(),
                branch: document.getElementById('addBranch').value,
                platform: document.getElementById('addPlatform').value,
                rating: document.getElementById('addRating').value,
                category: document.getElementById('addCategory').value,
                content: document.getElementById('addContent').value,
                author: document.getElementById('addAuthor').value,
                status: '미조치',
                date: new Date().toISOString().slice(0,16).replace('T', ' '),
                comments: []
            };
            vocList.unshift(newVoc);
            closeAddModal();
            document.getElementById('vocForm').reset();
            renderCards();
        }

        // 상태 버튼 클릭 시 순환 변경 (미조치 -> 조치중 -> 완료 -> 미조치)
        function cycleStatus(id) {
            let item = vocList.find(i => i.id === id);
            if(item) {
                if(item.status === '미조치') item.status = '조치중';
                else if(item.status === '조치중') item.status = '완료';
                else item.status = '미조치';
                renderCards();
            }
        }

        function deleteVoc(id) {
            if(confirm('해당 VOC 리뷰를 삭제하시겠습니까?')) {
                vocList = vocList.filter(i => i.id !== id);
                renderCards();
            }
        }

        function addComment(id) {
            let input = document.getElementById(`commentInput_${id}`);
            let text = input.value.trim();
            if(!text) return;
            let item = vocList.find(i => i.id === id);
            if(item) {
                item.comments.push({
                    author: '리테일 팀 / 마케팅팀',
                    text: text,
                    time: new Date().toISOString().slice(0,16).replace('T', ' ')
                });
                if(item.status === '미조치') item.status = '조치중';
                input.value = '';
                renderCards();
            }
        }

        renderCards();
    </script>
</body>
</html>
